name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-type-test:
    name: Validate, Lint, Typecheck & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies (frozen lockfile)
        run: uv sync --frozen --group dev

      - name: Verify uv.lock is up to date
        run: uv lock --check

      - name: Run Ruff linter & formatting check
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Run Mypy strict type checking
        run: uv run mypy src

      - name: Run pytest unit & packaging suite
        run: uv run pytest -q

      - name: Run full repository validation sweep
        run: uv run bigquery-data-science sweep

      - name: Build sdist & wheel and verify isolated installation + CLI + MCP
        if: matrix.python-version == '3.12'
        run: |
          uv build
          bash scripts/check_install.sh
