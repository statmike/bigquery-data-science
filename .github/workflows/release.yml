name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build sdist & wheel + smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Verify tag matches pyproject.toml version (exact or rc suffix)
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 -c '
          import os, pathlib, re, subprocess, tomllib
          tag = os.environ["TAG_NAME"]
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          base_tag = f"v{ver}"
          if tag == base_tag:
              print(f"Exact release tag match: {tag} == pyproject.toml {ver}")
          elif re.fullmatch(rf"{re.escape(base_tag)}rc[0-9]+", tag):
              rc_ver = tag.lstrip("v")
              print(f"Release-candidate tag {tag} for base {base_tag}; stamping {rc_ver} for build")
              subprocess.run(["uv", "version", rc_ver, "--no-sync"], check=True)
              init_p = pathlib.Path("src/bigquery_data_science/__init__.py")
              init_p.write_text(init_p.read_text().replace(f"\"{ver}\"", f"\"{rc_ver}\""))
          else:
              raise SystemExit(f"Tag {tag!r} does not match pyproject.toml version {base_tag!r} (or {base_tag}rcN)")
          '
      - name: Build distribution
        run: uv build
      - name: Smoke test wheel & PyPI metadata in clean venv
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv/bin/python dist/*.whl
          /tmp/smoke-venv/bin/python -c "
          import importlib.metadata, os, re, bigquery_data_science
          expected = os.environ['TAG_NAME'].lstrip('v')
          assert bigquery_data_science.__version__ == expected, f'{bigquery_data_science.__version__!r} != {expected!r}'
          desc = importlib.metadata.metadata('bigquery-data-science')['Description']
          rel = re.findall(r'\]\((?!https?://|#|mailto:)([^)]+)\)', desc)
          assert not rel, f'Relative links found in PyPI Description metadata: {rel}'
          print('Smoke test & PyPI metadata check passed:', bigquery_data_science.__version__)
          "
          /tmp/smoke-venv/bin/bigquery-data-science list >/dev/null
          /tmp/smoke-venv/bin/bigquery-data-science lookup ARIMA_PLUS >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI (pre-release tags only)
    needs: build
    if: contains(github.ref_name, 'rc')
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/bigquery-data-science
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI (stable tags)
    needs: build
    if: "!contains(github.ref_name, 'rc')"
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/bigquery-data-science
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    if: "!contains(github.ref_name, 'rc')"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/* \
              --verify-tag \
              --title "${{ github.ref_name }}" \
              --generate-notes
          fi
