name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build, Verify Tag Parity & Smoke-Test Artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Verify git tag matches pyproject.toml version
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          from pathlib import Path

          tag = os.environ["GIT_TAG"]
          expected = tag.removeprefix("v")
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if version != expected:
              print(f"ERROR: git tag {tag!r} != pyproject.toml version {version!r}", file=sys.stderr)
              sys.exit(1)
          print(f"Verified tag {tag} matches pyproject.toml version {version}")
          PY

      - name: Run full quality gate (lint, mypy, pytest, sweep)
        run: |
          uv run ruff check src tests
          uv run mypy src
          uv run pytest -q
          uv run bigquery-data-science sweep

      - name: Build sdist & wheel and run isolated smoke test
        run: |
          uv build
          bash scripts/check_install.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish Release Candidate to TestPyPI
    needs: build-and-verify
    if: contains(github.ref_name, 'rc')
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/bigquery-data-science
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish distributions to TestPyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish Final Release to PyPI
    needs: build-and-verify
    if: "!contains(github.ref_name, 'rc')"
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/bigquery-data-science
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish distributions to PyPI via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: [build-and-verify, publish-pypi]
    if: "!contains(github.ref_name, 'rc')"
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release with dist assets and generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" \
              --generate-notes
          fi
