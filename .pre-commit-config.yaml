# Local pre-commit hooks for statmike/bigquery-data-science.
# Install once with: uv run --frozen pre-commit install
# Run manually across all files with: uv run --frozen pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: uv-lock-public-pypi
        name: uv.lock public PyPI registry & zero internal URLs
        entry: >-
          python3 -c "import pathlib, re, sys;
          locks = [p for p in pathlib.Path('.').rglob('uv.lock') if '.venv' not in p.parts];
          bad = [f'{p}: {s}' for p in locks for s in set(re.findall(r'registry = \"([^\"]+)\"', p.read_text())) if s != 'https://pypi.org/simple'];
          leaks = [str(p) for p in locks if re.search(r'(\.uplink\.goog|\.corp\.google\.com|\.prod\.google\.com|c\.googlers\.com|pkg\.dev/[a-z0-9-]+-prod/)', p.read_text())];
          sys.exit('Non-public uv.lock registry or internal URL detected: ' + ', '.join(bad + leaks) if (bad or leaks) else 0)"
        language: system
        pass_filenames: false

      - id: ruff-check
        name: ruff check (src & tests)
        entry: uv run --frozen ruff check src tests
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy strict (src)
        entry: uv run --frozen mypy src
        language: system
        types: [python]
        pass_filenames: false

      - id: bigquery-data-science-sweep
        name: bigquery-data-science sweep (skills, syntax, narratives, links & headers)
        entry: uv run --frozen bigquery-data-science sweep
        language: system
        pass_filenames: false
