[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "bigquery-data-science"
version = "0.8.2"
description = "BigQuery ML, BigQuery AI, and 4-Lens Agent Skills: 104 live-verified SQL/Python workflows, zero-dependency CLI catalog & skill installer, and stdio MCP server."
dynamic = ["readme"]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Mike Henderson" }]
keywords = [
    "bigquery",
    "bigquery-ml",
    "bigquery-ai",
    "google-cloud",
    "gemini-enterprise",
    "vertex-ai",
    "agent-skills",
    "mcp",
    "machine-learning",
    "generative-ai",
    "sql",
    "bigframes",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Zero third-party runtime dependencies! `uvx bigquery-data-science` and `pip install bigquery-data-science`
# run purely on the Python 3.11+ standard library (`nbformat` is imported lazily in maintainer commands).
dependencies = []

[project.optional-dependencies]
# Core notebook runtime for all 104 notebooks across bigquery-ml/ and bigquery-ai/
notebooks = [
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.2",
    "bigquery-magics>=0.4",
    "bigframes>=1.25",
    "matplotlib>=3.8",
    "pydantic>=2.7",
    "tqdm>=4.66",
    "pillow>=10.0",
    "google-cloud-storage>=2.17",
    "google-cloud-documentai>=2.29",
    "jinja2>=3.1.6",
    "weasyprint>=68.1",
    "ipykernel>=6.29",
]
# GCP control-plane & orchestration SDKs for bigquery-ml/pipelines/*
pipelines = [
    "bigquery-data-science[notebooks]",
    "google-cloud-aiplatform>=1.60",
    "google-cloud-bigquery-datatransfer>=3.15",
    "google-cloud-bigquery-reservation>=1.16",
    "google-cloud-dataform>=0.5",
    "google-cloud-orchestration-airflow>=1.13",
    "google-cloud-pipeline-components>=2.14",
    "google-cloud-workflows>=1.14",
    "kfp>=2.7",
]
# Causal inference, survival analysis, and ONNX/XGBoost model import/export libraries for bigquery-ml/workflows/* and models/*
workflows = [
    "bigquery-data-science[notebooks]",
    "scikit-learn>=1.5",
    "scipy>=1.11",
    "numpy>=1.26",
    "xgboost>=2.0",
    "lifelines>=0.29",
    "differences>=0.2",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "skl2onnx>=1.17",
    "graphviz>=0.20",
]
# Complete optional suite
all = [
    "bigquery-data-science[notebooks,pipelines,workflows]",
]

[project.scripts]
bigquery-data-science = "bigquery_data_science.cli:main"

[project.entry-points."statmike.agent_skills"]
bigquery_data_science = "bigquery_data_science:get_skills_dir"

[project.urls]
Homepage = "https://github.com/statmike/bigquery-data-science"
Repository = "https://github.com/statmike/bigquery-data-science"
Documentation = "https://github.com/statmike/bigquery-data-science#readme"
Changelog = "https://github.com/statmike/bigquery-data-science/blob/main/CHANGELOG.md"
Issues = "https://github.com/statmike/bigquery-data-science/issues"

[dependency-groups]
dev = [
    "bigquery-data-science[notebooks]",
    "nbformat>=5.10",
    "nbclient>=0.10",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.11",
]

# --- Public PyPI Index Enforcement --------------------------------------------
# Explicitly pin public PyPI as the default index so workstation-local mirror
# configurations never leak into uv.lock.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# --- Packaging (Wheel & Sdist Scoping) ----------------------------------------
# Ship ONLY src/bigquery_data_science and force-include skills/ into the wheel.
# Excludes the 24 MB bigquery-ml/ and bigquery-ai/ notebook folders so the wheel
# stays < 1.5 MB and contains zero .ipynb files.
[tool.hatch.build.targets.wheel]
packages = ["src/bigquery_data_science"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "bigquery_data_science/_skills"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/skills",
    "/tests",
    "/scripts",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/CODE_OF_CONDUCT.md",
    "/SECURITY.md",
    "/CITATION.cff",
    "/plugin.json",
]
exclude = [
    "/bigquery-ml/**",
    "/bigquery-ai/**",
    "/architectures/**",
    "/docs/assets",
    "/.github",
    "/.agents",
    "/.claude",
    "/.claude-plugin",
    "/.pre-commit-config.yaml",
    "/uv.lock",
    "**/*.ipynb",
]

[tool.hatch.build.targets.sdist.force-include]
"skills" = "skills"

# --- PyPI README Link & Image Rewriting ---------------------------------------
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# 1. Swap the front-door Mermaid block with its pre-rendered PNG on PyPI
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(?s)```mermaid\nflowchart (?:LR|TD)\n.*?```'
replacement = '![bigquery-data-science architecture](https://raw.githubusercontent.com/statmike/bigquery-data-science/main/docs/assets/readme_architecture.png)'

# 2. Rewrite relative Markdown image paths to raw.githubusercontent.com
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://|data:)\.?/?([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/statmike/bigquery-data-science/main/\2)'

# 3. Rewrite relative Markdown file/directory links to github.com/statmike/bigquery-data-science/blob/main/
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)\.?/?([^)]+)\)'
replacement = '](https://github.com/statmike/bigquery-data-science/blob/main/\1)'

# --- Ruff & Mypy & Pytest -----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
